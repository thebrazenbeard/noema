[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "noema-research-core"
version = "0.0.1"
requires-python = ">=3.13,<3.14"
dependencies = [
  "jsonschema==4.26.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.2",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
